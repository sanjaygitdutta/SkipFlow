name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.27.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.27-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.27-Release-APK
          path: SkipFlow-v1.2.27.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.27' }}
          name: "SkipFlow v1.2.27 (JioHotstar 0ms Content Unmute & Flapping Loop Fix)"
          body: |
            ### 🚀 SkipFlow v1.2.27 — JioHotstar 0ms Content Unmute & Flapping Loop Fix

            #### 🌟 What's New & Fixed in v1.2.27:
            - 🔊 **0ms Instant Content Audio Unmute (Post-Ad)**:
              - Content audio now restores immediately at 0ms as soon as an in-stream ad finishes.
              - Removed the requirement for on-screen movie controls to be visible before unmuting, ensuring instant sound recovery even when video player controls are auto-hidden.
            - 🛡️ **Eliminated Audio Muting & Flapping Loop**:
              - **Active Ad Content Verification**: Ad containers (`ima_ad_container`, `ad_container`, `player_ad_layout`, `video_ad_layout`, `ad_overlay`) permanently retained in ExoPlayer layout are no longer treated as active ads when idle. Containers now strictly require active ad text, countdown digits, or active ad children.
              - **Event Interceptor Container Sanitization**: Prevented empty player container layout events from falsely triggering zero-latency audio mute during movie playback.
              - **Tightened Multi-Ad Transition Window**: Reduced multi-ad sequence hold window from 8s to 1.5s, preventing long muted gaps after ad completion, and instantly clearing sequence hold on single ("1 of 1") and final ("2 of 2", "3 of 3") ads.
              - **Reduced Watchdog Renewal**: Scaled poller watchdog renewal to 10s to prevent long false-positive mute holds.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.27.apk** (Release, Signed) for the best performance.
          files: |
            SkipFlow-v1.2.27.apk
            SkipFlow-v1.2.27-debug.apk
          prerelease: false
