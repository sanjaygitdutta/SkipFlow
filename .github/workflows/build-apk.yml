name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.17.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.17-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.17-Release-APK
          path: SkipFlow-v1.2.17.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.17' }}
          name: "SkipFlow v1.2.17 (Zero YouTube Ad Delay, Mid-Ad Leakage Fix & Ad 2 Mute Persistence)"
          body: |
            ### 🚀 SkipFlow v1.2.17 — Zero YouTube Ad Delay, Mid-Ad Leakage Fix & Ad 2 Mute Persistence

            #### 🌟 What's New in v1.2.17:
            - ⚡ **Instant 0.0s YouTube Ad Audio Muting (Litho UI Engine)**:
              - Added **Strategy 0.5 (Direct Instant Litho Ad Badge & Counter Lookup)**: OS-level text indexed search (<1ms) for standalone `"Sponsored"`, `"Ad"`, `"1 of 2"`, `"2 of 2"`, `"1/2"`, `"2/2"`, `"Video will play after"`, `"Playback will resume"`, and `"Visit advertiser"` inside the active video canvas.
              - Eliminates the 1s–4s delay when ads start on modern YouTube without waiting for countdowns or "Skip in 5s" to paint.
            - 🛡️ **Zero Mid-Ad Audio Leakage**:
              - Fixed `isNormalContentPlaying` false-positive bug: strictly excluded persistent generic video player containers (`player_view`, `surface_view`, `watch_player`) that caused the poller to falsely believe normal content was playing during ads.
              - Reinforced poller debounce: requires verified scrub bar timestamp (`time_current`) for rapid 50ms unmuting, or 8 consecutive non-ad checks (200ms) for unverified states. Single-tick redraw glitches never leak audio again.
            - 🔄 **Seamless Ad 1 ➔ Ad 2 Mute Persistence**:
              - Expanded `hasDistinctSecondaryAd` to detect all modern YouTube Ad 2 indicators (`"2 of 2"`, `"2/2"`, `"2 of 3"`, `"Video will play after"`, dedicated ad countdown IDs).
              - Updated `onSkipAttempted`: when Ad 1 is skipped, if Ad 2 is already queued or active, audio remains seamlessly muted with active polling intact.
            - 🎯 **Spatial Hierarchy Pruning for Strategy 3 (BFS)**:
              - Node expansion strictly pruned by video canvas bounds (`validAdBounds`), completely preventing the search queue from getting overwhelmed by recommendation feed or comment cards.
            - 🎵 **24/7 Screen-Off & Pocket Music Protection (Spotify MediaSession Listener)**:
              - Added dedicated `SkipFlowNotificationListenerService` that hooks live `MediaSession` tokens 24/7.
              - Eliminates screen-sleep restrictions: detects ads at **0.0s** by monitoring Spotify's stripped playback actions (`ACTION_SKIP_TO_NEXT`) and commercial ad durations even with screen completely black, locked, or in your pocket.
              - Added 1-tap setup card on Dashboard: no need to hunt for hidden settings inside Spotify.
            - ✨ **Onboarding Welcome Screen Complete Overhaul**:
              - **Sticky Floating Glassmorphic CTA Bar**: "Tap to Start" button pinned with a frosted gradient blur scrim—eager users can start instantly without long scrolling!
              - **Interactive 3-Tab Showcase Switcher**: Segmented glass tabs (`Life Stories`, `Vibe Waves`, `0ms Pipeline`) with smooth `Crossfade` transitions to eliminate scroll fatigue.
              - **Vibrant Brand & Social Proof Header**: Upgraded plain pill into an animated pulsing beacon with `0ms ⚡` tag and trust reassurance (`⭐ 4.9 Rating • 🛡️ 100% On-Device • 🔓 Zero Sign-Up`).
              - **Shimmering Hero Gradient Button**: Upgraded CTA button with animated light sweep and glowing ambient border.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.17.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.17.apk
            SkipFlow-v1.2.17-debug.apk
          prerelease: false
