name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.0.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.0.1-APK
          path: SkipFlow-v1.0.1.apk
          retention-days: 30

      - name: Create GitHub Pre-Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "SkipFlow v1.0.1 Improved Update"
          body: |
            ### ⏩ SkipFlow v1.0.1 (Precision Ad Detection & Sound Fix)
            
            #### 🛠️ What's Improved in this update:
            - **Fixed Audio Muting False Positives**: Static display banners & sponsored products below the video player no longer mute your video sound. Audio muting strictly triggers only for actual in-stream video ads!
            - **Guaranteed Volume Restoration**: Audio is immediately restored the instant an ad is skipped or video resumes, so the next video sound is never muted.
            - **Fixed Permission Prompt Bug**: Multi-source accessibility validation ensures you won't be repeatedly asked for permissions once granted on your device.
          files: SkipFlow-v1.0.1.apk
          prerelease: false
