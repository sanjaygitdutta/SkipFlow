name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.0.0-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-Debug-APK
          path: SkipFlow-v1.0.0-debug.apk
          retention-days: 30

      - name: Create GitHub Pre-Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-preview
          name: "SkipFlow v1.0.0 Preview APK"
          body: |
            ### ⏩ SkipFlow Hands-Free YouTube Assistant (Debug APK)
            
            **Direct Download:** Download `SkipFlow-v1.0.0-debug.apk` below and install it directly on your Android phone!
            
            #### 🌟 Features in this build:
            - **Auto-Skip Ads**: Automatically taps YouTube skip button when countdown finishes.
            - **Smart Audio Mute**: Silences ad audio and restores volume when video resumes.
            - **Wave-to-Skip**: Proximity sensor detection for cooking & messy hands.
            - **In-App Sandbox Simulator**: Test auto-skipping right inside the app!
          files: SkipFlow-v1.0.0-debug.apk
          prerelease: true
