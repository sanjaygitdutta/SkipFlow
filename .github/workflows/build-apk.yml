name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        id: gradle_build
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Report Build Output
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "::error title=Gradle Build Failed::$(tail -n 30 build_output.log)"
          tail -n 80 build_output.log
          exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
