name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.10.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.10-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.10-Release-APK
          path: SkipFlow-v1.2.10.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.10' }}
          name: "SkipFlow v1.2.10 (Exact Matching Lifestyle Stories, Large Hero Carousel & 1.5s Auto-Swipe)"
          body: |
            ### 🚀 SkipFlow v1.2.10 — Exact Matching Catchy Words, Large Hero Carousel & 1.5s Auto-Swipe

            #### 🌟 What's New & Fixed in v1.2.10:
            - 🎯 **100% Accurate Visual Pairing (Image + Catchy Headline & Subtitle)**:
              - **Dining & Meals**: Shows person eating food at the dining table with smartphone -> *"Hands-Free Enjoy Content: Never drop your spoon or grease your screen to skip ads while eating"*.
              - **Safe Commute & Drive**: Shows driver's hands gripping car steering wheel -> *"Eyes on Road, Ears on Flow: Keep both hands on the wheel — video & audio ads auto-skipped safely"*.
              - **Kitchen & Cooking**: Shows woman chopping vegetables while watching recipe tutorial on laptop -> *"Messy Hands? Zero Touch: Follow recipes & cooking tutorials without touching screen with wet hands"*.
              - **Couch & Movie Night**: Shows friends sharing popcorn on sofa watching laptop -> *"Non-Stop Cinema Magic: Grab your popcorn, relax on the sofa, and stream without commercial breaks"*.
              - **Music & Podcasts**: Shows smiling man with earphones enjoying audio beats -> *"Seamless Audio Beats: Smart audio ad muter lets your workout beats & podcast episodes flow"*.
              - **Family & Bedtime**: Shows parents and toddler in bed watching tablet screen together -> *"Peace of Mind Streaming: Enjoy bedtime stories and cartoons together free from loud sudden ads"*.
            - 🖼️ **Increased Image Size & Immersive Single-Card Display**:
              - Enlarged hero lifestyle card to **290dp** on the Welcome / First Screen and **205dp** on Dashboard.
              - Showcases exactly **one clean, full-bleed card at once** without awkward clipping.
            - ⏱️ **1.5s Auto-Swipe Stay + Story Progress Indicators**:
              - Smooth 1.5-second story timer with top progress dashes and instant left/right tap navigation.
            - 🛡️ **Zero Start Delay & Immunity**:
              - All v1.2.9 optimizations preserved: 0ms audio recovery, YouTube player overlay immunity, 3D Swipe & Drag-to-Lock platform protection.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.10.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.10.apk
            SkipFlow-v1.2.10-debug.apk
          prerelease: false
