name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace > build.log 2>&1 || {
            ERR_MSG=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error title=Gradle Build Failure::$ERR_MSG"
            cat build.log
            exit 1
          }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
