name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.25.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.25-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.25-Release-APK
          path: SkipFlow-v1.2.25.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.25' }}
          name: "SkipFlow v1.2.25 (JioHotstar 0ms Ad Muting & Audio Flapping Fix)"
          body: |
            ### 🚀 SkipFlow v1.2.25 — JioHotstar 0ms Instant Ad Muting & Audio Flapping Fix

            #### 🌟 What's New & Fixed in v1.2.25:
            - 🛡️ **0ms Ad Start Detection (Fixed 1-3s Audio Leak at Ad Start)**:
              - Elevated ad container layouts (`player_ad_layout`, `video_ad_layout`, `ima_ad_container`, `ad_container`) to Priority Zero with visible bounds verification. Mutes instantly at second 0.0 without waiting for countdown text to render.
            - 🎬 **Eliminated Content Audio Muting & Flapping on Normal Playback**:
              - **Movie Control Protection**: Direct evaluation of 10-second rewind (`exo_rew`) and fast-forward (`exo_ffwd`) buttons at Priority -1. Normal movie/show content is strictly protected from false positive ad muting.
              - **Scoped Countdown Parser**: Updated parser to strictly require `00:SS` or ad cues (`[Ad]`, `1 of 3`, `ends in`, `s`, `ⓘ`), completely preventing standard movie elapsed timestamps (`0:05`, `0:15`, `1:20`) from being parsed as ad countdowns.
              - **Debounced Audio Restoration**: Eliminated audio flapping during multi-ad breaks and when player controls auto-fade. Audio restores cleanly and stays unmuted during normal content.
            - 🎯 **Expanded Jio App Coverage**:
              - Added comprehensive package and view ID routing across `in.startv.hotstar`, `com.jiohotstar.android`, `com.jio.media.ondemand`, and `com.disney.hotstar`.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.25.apk** (Release, Signed) for the best performance.
          files: |
            SkipFlow-v1.2.25.apk
            SkipFlow-v1.2.25-debug.apk
          prerelease: false
