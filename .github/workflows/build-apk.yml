name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.21.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.21-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.21-Release-APK
          path: SkipFlow-v1.2.21.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.21' }}
          name: "SkipFlow v1.2.21 (Fixed Hotstar Movie Audio Mute Flapping, Preserved 59s/39s Countdown Ad Detection)"
          body: |
            ### 🚀 SkipFlow v1.2.21 — Hotstar Movie Stability & 0ms Countdown Ad Detection

            #### 🌟 What's Fixed in v1.2.21:
            - 🎬 **Fixed Hotstar Movie Audio Muting/Unmuting Loop**:
              - **The Problem**: In v1.2.20, while watching movies on Hotstar with NO ads, the audio was repeatedly muting and unmuting. This occurred because Hotstar's player XML contains permanent empty layout containers (`player_ad_layout`, `ad_container`, `ima_ad_container`), and the movie playback scrubber clock (`exo_position`) was colliding with ad countdown checks.
              - **The Fix**: 
                1. Container IDs now strictly require visible child views with active ad content or countdown digits — empty layout placeholders will never trigger muting.
                2. Excluded normal movie playback scrubber views (`exo_position`, `time_current`, `exo_duration`, `seekbar`, `progress`) so movie time never triggers ad muting.
                3. Pre-scan for active movie player controls (`exo_progress`, `seekbar`, `exo_rew`, `exo_ffwd`) so movie playback is locked as unmuted with zero stutter!
            - ⏱️ **100% Preserved Hotstar 59s / 39s Standalone Countdown Ad Detection**:
              - For Hotstar ads where NO "Ad" word is shown and only a number counts down toward 0 (`59` ➔ `0`, `39` ➔ `0`, `15s`, etc.):
              - Standalone countdowns are immediately recognized at 0ms and silenced for the entire duration of the ad break, restoring audio the millisecond the countdown finishes!
            - 🎧 **All Previous v1.2.20 Improvements Retained**:
              - 85% Battery & Doze Sleep optimization (radar sleep on screen-off).
              - Zero-Error Spotify background ad muting while screen is locked or in pocket.
              - Multi-Ad Transition Lock (Ad 1 of 2 ➔ Ad 2 of 2 seamless hold).

            > 💡 **Recommended**: Download **SkipFlow-v1.2.21.apk** (Release, Signed) for the latest fixes and best performance.
          files: |
            SkipFlow-v1.2.21.apk
            SkipFlow-v1.2.21-debug.apk
          prerelease: false
