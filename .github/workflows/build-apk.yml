name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.15.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.15-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.15-Release-APK
          path: SkipFlow-v1.2.15.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.15' }}
          name: "SkipFlow v1.2.15 (JioHotstar, Spotify & MX Player 0ms Ad Mute & Restore Fix)"
          body: |
            ### 🚀 SkipFlow v1.2.15 — JioHotstar, Spotify & MX Player 0ms Ad Mute & Fast Return

            #### 🌟 What's New in v1.2.15:
            - 🤩 **Interactive Mood & Vibe Simulator (Concept 2)**:
              - Added to Welcome & Dashboard screens: visualizes how sudden loud ads shatter immersion vs SkipFlow's 0ms unbroken flow.
              - Live Before/After interactive toggle switch: "Without SkipFlow" (violent mood plunge to 0%, 📢 😫 🤬 💔) vs "With SkipFlow" (100% pure flow, 🛡️ 😌 ✨ 💯).
              - Dynamic Canvas mood waveform graph with animated scrubber playhead, reactive emojis, and noise shock impact metrics.
            - 🎬 **MX Player 0ms Ad Audio Muting & Fast Audio Recovery**:
              - Accurately detects and silences in-stream video ads formatted as `ad 1 of 3 : 15`, `ad 2 of 3 : (15)`, `ad 3 of 3 : (10)`, `ad 1 of 2 : (10)`, `ad 2 of 2 : (5)`, `ad 1 of 1 : 29` counting down towards 0.
              - Multi-layout inspection supporting bare break counters (`2 of 3 : (15)`, `3 of 3 : (10)`, `2 of 2 : (5)`, `1 of 3`, `1 of 1`, `1 of 2`) with parentheses `( )`, colons `: `, brackets, or prefixes/suffixes.
              - **Instant 0ms Muting**: Audio stream is silenced at 0ms as soon as the ad break counter appears.
              - **Instant 0ms Audio Restoration**: Content audio is restored at 0ms the moment normal content resumes.
              - **Auto-Skip Support**: Automatically clicks "Skip Ad" / "Skip Ads" buttons as soon as they appear after a few seconds of ad playback, instantly restoring audio.
              - Seekbar and movie player protection prevents false positives during normal video playback.
            - 📺 **JioHotstar Standalone Ad Countdown Timers (0ms Mute & 0ms Recovery)**:
              - Accurately detects and mutes in-stream video ads that display **ONLY the time count** on screen without any "Ad" word or "1 of 1" break counter.
              - Full support for bare numbers counting down: `59`, `29`, `15`, `5`, `1` (counting down towards 1/0).
              - Full support for time formats: `1:29`, `1:28`, `0:59`, `0:15`, `0:01` (counting down towards 1/0).
              - Full support for prefix/suffix variations: `· 59`, `• 59`, `. 59`, `59s`, `:59`, `(59)`, `· 1:29`, `• 1:29`, `. 1:29`, `(1:29)`.
              - **Instant 0ms Muting**: Audio is muted at 0ms as soon as the countdown timer appears in the video player frame.
              - **Instant 0ms Audio Recovery**: Normal content audio is restored at 0ms the moment the countdown finishes and disappears.
              - Zero false positives on normal movie playback via seekbar & playback controls protection.
            - 🎵 **Spotify Screen-Sleep Ad Audio Muting & 0ms Fast Recovery**:
              - Automated MediaSession & Notification Action inspection: detects when Spotify removes or disables the "Next Track" skip button during commercial ads while screen is asleep or locked.
              - Advanced ad identification catching sponsor brand titles (empty album, "Spotify" artist/label, non-track URI IDs).
            - 📺 **YouTube Clean Screen Auto-Dismiss Engine**:
              - Solves YouTube's stuck accessibility controls (Pause, 10s Rewind, 10s Forward, Close 'X' button) 100% automatically without requiring user to touch YouTube settings.
              - Automatically auto-fades and dismisses player controls after 2.5 seconds of normal playback, restoring an unobstructed clean view on every video.
              - Instantly dismisses player controls post-skip so returning videos play with a completely clean screen.
              - Intelligently preserves controls when the video is paused by the user.
            - 🏋️ **Gym & Workout Story Carousel (Manual & Auto-Swiping)**:
              - Added dedicated gym workout slide: *"Gym Beats Without Disturbed Workout"* — keeps workout pump uninterrupted and weights lifted without touching screen to skip sudden loud ads.
              - Full manual swipe freedom: users can swipe through all story slides manually with zero resistance or tap discrete edge arrows, while idle states continue auto-swiping continuously.
            - ⏳ **Sideways Hourglass Filter Pipeline**:
              - Interactive horizontal hourglass animation with laser core and filtered audio waves.
            - 🖐️ **Smart Gesture Wave Sensor Card**:
              - Proximity wave-to-skip with dynamic radar waves and hand animation.
            - 📊 **Detailed Audio & Video Ads Analytics**:
              - Accurate platform breakdown dialog and lifetime streaks tracking.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.15.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.15.apk
            SkipFlow-v1.2.15-debug.apk
          prerelease: false
