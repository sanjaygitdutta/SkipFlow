name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Check Build Result and Locate APK
        run: |
          echo "=== BUILD LOG SUMMARY ==="
          grep -E "Task :|BUILD|FAILURE|ERROR" build_output.log || tail -n 40 build_output.log
          echo "=== SEARCHING FOR APK ==="
          find . -type f -name "*.apk"
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
