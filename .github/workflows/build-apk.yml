name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.1.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.9-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.9-Release-APK
          path: SkipFlow-v1.1.9.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.9
          name: "SkipFlow v1.1.9 (Instant Content Audio & Reliable Ad Muting Across N Videos)"
          body: |
            ### ⏩ SkipFlow v1.1.9 — Instant Content Audio & Reliable Ad Muting Across N Videos

            #### 🌟 What's Fixed in v1.1.9:
            - 🔊 **Fixed Content Muting on New Videos**:
              - Removed YouTube on-screen media player control `skip_button` from ad detection. Previously, YouTube's 10–12 second player overlay controls (`skip_button`) triggered false ad muting whenever a new video started.
              - Narrowed skip keyword matching: eliminated broad `"contains(skip)"` matching that erroneously matched YouTube's *"Double-tap to skip 10 seconds"* hint.
            - 🎯 **Fixed Ad Muting & 50% Player Coverage**:
              - Expanded player boundary cap from 34% to **50%**, ensuring that on tall and widescreen phones (20:9, 21:9), in-stream ad countdowns and skip buttons at the bottom of the video player are 100% captured and muted from the first frame.
            - ⚡ **Zero-Lag Immediate Unmuting**:
              - Removed artificial delays when an ad finishes: audio restores instantly the millisecond regular content begins.
              - Failsafe stream volume recovery actively restores normal listening volume if Android system audio ever drops to 0.
            - 👆 **Precision Skip Clicks**:
              - Direct hardware tap gesture centered on the exact physical skip button bounds.
              - Multi-language support across YouTube and OTT streaming apps.

            > 💡 **Recommended**: Download **SkipFlow-v1.1.9.apk** (Release, Signed).
          files: |
            SkipFlow-v1.1.9.apk
            SkipFlow-v1.1.9-debug.apk
          prerelease: false
