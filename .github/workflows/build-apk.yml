name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.1.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.4-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.4-Release-APK
          path: SkipFlow-v1.1.4.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4
          name: "SkipFlow v1.1.4 (Obsidian Redesign & Audio Reliability)"
          body: |
            ### ⏩ SkipFlow v1.1.4 — Obsidian Redesign & Audio Reliability

            #### 🌟 What's New in v1.1.4:
            - 🎨 **Deep Space Obsidian & Neon Dashboard**: Disabled wallpaper color tinting and gave the entire app a high-contrast obsidian console look with atmospheric glow.
            - 🎯 **Fixed False-Positive Video Muting**: Removed feed-level keywords ("sponsored", "learn more", "ad_view", "ad_badge") that caused normal videos to be muted when starting.
            - 📐 **Precise 38% YouTube Player Bounding**: Bounded YouTube portrait scanning strictly to the top 38% of the screen, isolating the player from comments and feed.
            - ⚡ **Instant Post-Skip Audio Restoration**: Sound is now restored within 200ms when an ad is skipped.
            - 🔄 **Deferred Event Scheduler**: Throttled content events are deferred instead of dropped, ensuring skip buttons are never missed.
            - 🔑 **Permanent Release Signature**: Signed with official permanent keystore for seamless future updates.

            > 💡 **Installation Note**: If you previously had an older test build installed, please uninstall the old version first before installing v1.1.4 to clear signature caches.
          files: |
            SkipFlow-v1.1.4.apk
            SkipFlow-v1.1.4-debug.apk
          prerelease: false
