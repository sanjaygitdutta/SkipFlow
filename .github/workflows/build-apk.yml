name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.14.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.14-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.14-Release-APK
          path: SkipFlow-v1.2.14.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.14' }}
          name: "SkipFlow v1.2.14 (JioHotstar 0ms Half-Screen Ad Counter & Sideways Hourglass Pipeline)"
          body: |
            ### 🚀 SkipFlow v1.2.14 — JioHotstar 0ms Ad Counter Fix & Sideways Hourglass Pipeline

            #### 🌟 What's New in v1.2.14:
            - 📺 **JioHotstar Half-Screen & Portrait Ad Counter Fix**:
              - Mutes in-stream video ads running with NO "Ad" word (`1 of 1 . 00:15`, `1 of 3 . 00:14`, `2 of 3 . 00:14`, `3 of 3 . 00:08`, `1 of 2 . 00:30`, `2 of 2 . 00:15`).
              - Added period/dot separator (`.`), middle dot (`·`), and split-node timer support in video frames.
              - Instant 0ms audio mute on ad start, and instant 0ms restoration as soon as content resumes.
            - ⏳ **Sideways Hourglass Filter Pipeline**:
              - Interactive horizontal hourglass animation replacing static platform badges.
              - Raw incoming feed on the left with flashing red `[AD]` indicators.
              - SkipFlow 0ms vortex core in the middle with rotating laser energy ring.
              - Pure filtered stream on the right waving one by one with green checkmarks and bouncing equalizers.
            - 🖐️ **Smart Gesture Card**:
              - Dedicated wave-to-skip card with dynamic proximity sensor radar ripples and hand animation.
            - 📊 **Platform Breakdown Analytics & Streaks**:
              - Translucent pop-up dialog with per-platform live monitoring and streak tracker.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.14.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.14.apk
            SkipFlow-v1.2.14-debug.apk
          prerelease: false
