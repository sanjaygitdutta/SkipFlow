name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.3.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.3-APK
          path: SkipFlow-v1.1.3.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "SkipFlow v1.1.3 (Multi-App OTT Full Expansion & Fixes)"
          body: |
            ### ⏩ SkipFlow v1.1.3 — Full Multi-App OTT Expansion & Reliability Fixes

            #### 🌟 What's New in v1.1.3:
            - 🎬 **Full OTT App Coverage**: Added official support for **SonyLIV** (`com.sonyliv`), **Zee5** (`com.graymatrix.did`), and Global **Disney+ Hotstar** (`com.disney.hotstar`) alongside existing Hotstar, JioCinema, MX Player, DailyMotion, and Twitch.
            - 📐 **OTT Full-Screen Coordinate Fix**: Removed the 52% portrait screen bounding restriction for OTT apps. Skip and close buttons located anywhere on the screen (even bottom-right corners or interstitial overlays) are now instantly clicked.
            - 🔇 **OTT Smart Ad Muter**: Ad countdown timers on Disney+ Hotstar and JioCinema now trigger silent audio muting just like YouTube.
            - 🔤 **Short "Skip" Text Matching**: Resolved detection failures on OTT apps where buttons simply say "Skip" or "Skip >" instead of "Skip Ad".
            - 🎧 **Spotify Ad Receiver Robustness**: Broadened URI and title matching to catch empty-artist promos and "Spotify Free" announcements.
          files: SkipFlow-v1.1.3.apk
          prerelease: false
