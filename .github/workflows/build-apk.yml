name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.0-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.0-Release-APK
          path: SkipFlow-v1.2.0.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "SkipFlow v1.2.0 (100% Guaranteed Real Ad Audio Muting & Instant Content Sound)"
          body: |
            ### ⏩ SkipFlow v1.2.0 — 100% Guaranteed Real Ad Audio Muting & Instant Content Sound

            #### 🌟 What's Fixed in v1.2.0:
            - 🔇 **100% Real Ad Audio Muting Guaranteed**:
              - Restored full in-stream ad countdown and badge markers: `"Sponsored ·"`, `"Sponsored"`, `"Ad ·"`, `"Ad •"`, `"Ad 1 of 2"`, `"Video will play after ad"`, and multi-language badges (Spanish, Hindi, French, German, Russian, etc.).
              - Modern single in-stream ads (15s bumper and non-skippable ads) are now instantly detected and silenced from frame 0.
            - 👆 **Support for Modern Compose & Litho Skip Buttons**:
              - Expanded in-stream ad state inspector to detect custom Jetpack Compose and Litho buttons by localized text (`"Skip Ad"`, `"Skip"`, `"Omitir anuncio"`), even when Android view IDs are absent.
            - 🎛️ **Dual-Action Hardware Stream Silencing**:
              - Combines `AudioManager.adjustStreamVolume(STREAM_MUSIC, ADJUST_MUTE, 0)` with `setStreamVolume(0)` to prevent audio flinger leaks on Samsung OneUI, Xiaomi MIUI/HyperOS, OnePlus, and Oppo devices.
            - ⚡ **Zero Audio Blips & Instant Normal Sound**:
              - Instant 0ms unmute whenever regular video controls (`time_bar`, `current_time`) appear.
              - 350ms hysteresis confirmation debounce prevents transient countdown redraws from prematurely unmuting ad audio.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.0.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.0.apk
            SkipFlow-v1.2.0-debug.apk
          prerelease: false
