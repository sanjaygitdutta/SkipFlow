name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.24.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.24-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.24-Release-APK
          path: SkipFlow-v1.2.24.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.24' }}
          name: "SkipFlow v1.2.24 (JioHotstar 0ms Ad Muting, All Timer Variations & Multi-Ad Transition Lock)"
          body: |
            ### 🚀 SkipFlow v1.2.24 — JioHotstar 0ms Ad Muting & Universal Timer Handling

            #### 🌟 What's New & Fixed in v1.2.24:
            - 🎯 **Full Support for Merged JioHotstar App (`com.jio.media.ondemand`)**:
              - Added dedicated package routing, foreground radar, and 0ms lifecycle handling for the unified JioCinema / JioHotstar merged application client (`com.jio.media.ondemand`).
            - ⏱️ **Universal 0ms Timer Variation & Countdown Support**:
              - **All Timer Formats**: Instant 0ms detection for `mm:ss` (`00:13`, `00:33`), `m:ss` (`0:05`, `0:15`, `1:30`), bare seconds (`5s`, `15s`, `30s`, `59s`), phrased countdowns (`Ad ends in`, `Skip in`, `Video will play after ad`), and bare numeric counts.
              - **Duration Scaling**: Parser ceiling expanded from 180s to 600s (up to 10-minute long-form ads).
            - 🔄 **Multi-Ad Sequence Lock (`1 of 3`, `1 of 2`)**:
              - In-stream compound break counters (`1 of 3 • 00:33`, `1 of 2 · 0:15`) now activate an atomic mute lock across the momentary 200–400ms transition gaps between Ad 1, Ad 2, and Ad 3, eliminating ad audio leaks during back-to-back commercial breaks.
            - 🏷️ **Sponsor Companion Card & CTA Fast-Path**:
              - Sub-millisecond direct indexing for `[Ad]` badges, `Galaxy Z Fold8`, `Tanishq`, and companion action buttons (`Own Now`, `Shop Now`, `Buy Now`, `Order Now`, `Install Now`, `Learn More`).
            - 🛡️ **Zero-Timer Ad Protection**:
              - Ads with no visible countdown timers are instantly silenced at 0ms via badge, break counter, or companion card detection.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.24.apk** (Release, Signed) for the best performance.
          files: |
            SkipFlow-v1.2.24.apk
            SkipFlow-v1.2.24-debug.apk
          prerelease: false
