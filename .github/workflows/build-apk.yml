name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.9-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.9-Release-APK
          path: SkipFlow-v1.2.9.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.9' }}
          name: "SkipFlow v1.2.9 (3D Swipe & Drag-to-Lock Carousel, Zero Start Delay & Audio Immunity)"
          body: |
            ### 🚀 SkipFlow v1.2.9 — 3D Swipe & Drag-to-Lock Platform Protection + Zero Audio Delay

            #### 🌟 What's New & Fixed in v1.2.9:
            - 🛡️ **Zero Delay When Content Starts (Fixes 10s–50s Silent Playback)**:
              - Fixed an issue where YouTube's player controls overlay (Forward 10s, Rewind 10s buttons with "10", time display, and empty ad view placeholders) was falsely recognized as an early ad countdown.
              - Added strict **Playback Control & Video Title Immunity**: Forward 10s, Rewind 10s, Pause/Play, chapter markers, and video titles (e.g. "Part 1 of 2", "Download:") can NEVER trigger ad detection or muting.
              - Empty view containers and ghost views in YouTube's layout with blank text are strictly ignored.
            - ⚡ **Instant 0ms Content Audio Recovery**:
              - The exact moment normal content playback is confirmed on screen (via video title, play/pause, or time bar), volume is restored IMMEDIATELY with 0ms delay.
            - 🔒 **3D Swipe & Drag-to-Lock Platform Protection**:
              - New interactive 3D perspective card carousel on the Dashboard inspired by modern tactile card drawers.
              - Horizontal swipe through YouTube, Disney+ Hotstar, JioCinema, and Spotify.
              - Tactile drag-down gesture with amber/gold pedestal illumination and haptic feedback to lock and protect ad skipping and audio muting.
            - ⏱️ **Optimized Failsafe Watchdog**:
              - Watchdog failsafe trimmed to 35s (renewed dynamically while confirmed ads are actively playing) so audio can never be held hostage.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.9.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.9.apk
            SkipFlow-v1.2.9-debug.apk
          prerelease: false
