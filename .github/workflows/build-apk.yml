name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.1-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.1-Release-APK
          path: SkipFlow-v1.2.1.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "SkipFlow v1.2.1 (Instant Content Audio & Lengthy Ad Support)"
          body: |
            ### ⏩ SkipFlow v1.2.1 — Instant Content Audio & Lengthy Ad Support

            #### 🌟 What's Fixed in v1.2.1:
            - 🔊 **Permanent Fix for Post-Ad Audio Silence**:
              - Clamped the video player inspection boundary strictly to the top **33%** of screen height in portrait mode. Feed items, shopping carousels, and channel bars below (>40%) are physically excluded.
              - In-stream badges must now contain separator bullets (`·`, `•`, `:`) or countdown digits/time (`0:15`, `0:45`, `5s`). Static shopping cards without time or bullets are completely ignored.
              - Removed ghost containers (`ad_player_overlay`, `instream_ad_player_overlay`). SkipFlow requires genuine, non-blank text.
            - ⏱️ **Full Support for Lengthy Ads (45s–120s+)**:
              - Autonomous 150ms active poller dynamically extends the watchdog as long as a real ad is counting down on screen.
              - Even 60s, 90s, or 2-minute ads stay 100% muted throughout their entire duration.
            - ⚡ **Instant Sound Restoration on Skip Click**:
              - When "Skip Ad" is tapped, audio is verified and restored in 200ms with zero wait.
              - Base watchdog safely reset to 35s, guaranteeing content is never muted for minutes.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.1.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.1.apk
            SkipFlow-v1.2.1-debug.apk
          prerelease: false
