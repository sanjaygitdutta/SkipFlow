name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.0.2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.0.2-APK
          path: SkipFlow-v1.0.2.apk
          retention-days: 30

      - name: Create GitHub Pre-Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "SkipFlow v1.0.2 (Auto-Close Banner Ads)"
          body: |
            ### ⏩ SkipFlow v1.0.2 (Auto-Close Banners & Smart Mute)
            
            #### 🌟 New Features & Improvements:
            - **Auto-Close Banner Ads**: Automatically taps the "X" / "Close" button on popup and overlay ad banners in both portrait mode and full-screen video playback without interrupting your video sound!
            - **Fixed Audio Muting False Positives**: Static banners below the video player no longer mute the video.
            - **Instant Volume Restoration**: Video sound is 100% guaranteed to restore smoothly when skipping or transitioning to the next video.
            - **Permission Fix**: Universal system settings validation prevents repeated permission prompts.
          files: SkipFlow-v1.0.2.apk
          prerelease: false
