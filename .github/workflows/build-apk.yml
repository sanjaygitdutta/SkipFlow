name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.23.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.23-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.23-Release-APK
          path: SkipFlow-v1.2.23.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.23' }}
          name: "SkipFlow v1.2.23 (0ms Ad Muting & Seekbar Protection for Hotstar, Prime, Zee5, SonyLIV, MX Player & YouTube)"
          body: |
            ### 🚀 SkipFlow v1.2.23 — Universal 0ms Ad Muting & Video Seekbar Protection

            #### 🌟 What's Fixed in v1.2.23:
            - 🎯 **Eliminated Ad Seekbar False Normal-Content Detection Across All 5 OTT Platforms**:
              - **The Problem**: During in-stream ads on **JioHotstar**, **Amazon Prime Video**, **Zee 5**, **SonyLIV**, and **MX Player**, the video ad player renders an orange/yellow progress bar or seekbar (`exo_progress`, `seekbar`, `player_progress`, `mx_progress`, `player_seekbar`). Because normal content detection checked for these generic progress bars, any slight polling gap falsely flagged "movie playing", causing premature unmuting and audio leaks.
              - **The Universal Fix**:
                1. Removed all generic seekbars, progress bars, and player containers from normal content view IDs across **JioHotstar, Prime Video, Zee5, SonyLIV, and MX Player**.
                2. Normal content confirmation now strictly checks for genuine interactive movie controls (Rewind 10s `btn_rewind` / `exo_rew`, Fast-Forward 10s `btn_forward` / `exo_ffwd`, X-Ray buttons) or dual movie duration timestamps (e.g. `14:20 / 48:15` or `-34:20`).
                3. Interactive movie controls are preserved and auto-fade naturally after 2–3s, giving users a 100% clean, uncluttered movie viewing experience with zero false muting.
            - ⏱️ **Universal 0ms Standalone Countdown Ad Detection (`00:59`, `00:35`, `00:15`, `0:29`, `15s`)**:
              - Ads starting at any countdown duration (`00:59`, `00:45`, `00:35`, `00:15`, `15s`) without explicit "Ad" text are now instantly detected and muted at 0ms when movie controls and movie timestamps are absent.
              - Full support for bracketed `[Ad]` and `(Ad)` badges across all platforms.
              - Added Hotstar companion card CTAs (`"Own Now"`, `"Shop Now"`, `"Know More"`, `"Order Now"`, `"Claim Now"`).
            - 📺 **YouTube Mid-Playback Muting Guard**:
              - Fixed rare mid-video false auto-muting (occurring ~4 minutes into content) by filtering out closed captions / subtitles (`isCaptionOrSubtitleNode`), video title containers (`isPlaybackControlOrVideoTitle`), and long spoken dialogue (>80 characters).
            - 🏋️ **Modernized Onboarding Media**:
              - Replaced lifestyle gym image with high-definition athlete visual asset.
            - 🎬 **YouTube 'Sponsored ·' 0ms Priority Zero Fast-Path Retained**.
            - 🎧 **Spotify Background Receiver & Battery Optimization Retained**.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.23.apk** (Release, Signed) for the best performance.
          files: |
            SkipFlow-v1.2.23.apk
            SkipFlow-v1.2.23-debug.apk
          prerelease: false
