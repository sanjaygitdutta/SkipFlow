name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.1.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.7-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.7-Release-APK
          path: SkipFlow-v1.1.7.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.7
          name: "SkipFlow v1.1.7 (Instant 0s Mute, Zero Phantom Silence & Robust Auto-Skip)"
          body: |
            ### ⏩ SkipFlow v1.1.7 — Instant 0s Mute, Zero Phantom Silence & Robust Auto-Skip

            #### 🌟 What's Fixed in v1.1.7:
            - ⚡ **Instant Frame-One Ad Muting (0s Delay)**: Added modern YouTube overlay IDs, `ad_countdown_text`, and `Sponsored` badge indicators. Event throttle reduced from 180ms to 60ms. Eliminates the initial 1–2 second audio leak when an ad begins.
            - 🛡️ **Zero Ghost/Phantom Muting during Content**: Fully eliminated phantom views (0x0 bounds). Normal video playback will NEVER remain muted.
            - ⏱️ **Autonomous Watchdog with Dynamic Long-Ad Extension**: Replaced the rigid 3-minute timeout with an autonomous 65s failsafe that automatically renews for legitimate 35s–60s long ads while actively confirmed on screen.
            - 📐 **Dynamic Player Geometry (36%–44%)**: Dynamic boundary calculation accurately encompasses the entire video player across all aspect ratios (16:9, 18:9, 20:9), while strictly excluding comments and feed.
            - 🚫 **Countdown Protection Guard**: Strictly prevents clicks during countdown (*"Skip in 5s"*, *"5"*). Ads are only clicked when the skip button actually becomes actionable.
            - 👆 **Simultaneous Hardware Touch Tap**: Dispatches physical `dispatchTapGesture` alongside accessibility `ACTION_CLICK`, guaranteeing that modern Litho/Compose buttons cannot swallow or ignore skip actions.
            - 🔄 **Verified Unmuting**: Audio verifies that an ad has fully cleared (handling *Ad 1 of 2* into *Ad 2 of 2* seamlessly) before restoring normal volume.

            > 💡 **Recommended**: Download **SkipFlow-v1.1.7.apk** (Release). If upgrading from an older debug build, uninstall the previous version once to clear signature caches.
          files: |
            SkipFlow-v1.1.7.apk
            SkipFlow-v1.1.7-debug.apk
          prerelease: false
