name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.25.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.25-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.25-Release-APK
          path: SkipFlow-v1.2.25.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.25' }}
          name: "SkipFlow v1.2.25 (JioHotstar Movie Audio Stability & Instant 0ms Ad Muting)"
          body: |
            ### 🚀 SkipFlow v1.2.25 — JioHotstar Movie Audio Stability & Instant 0ms Ad Muting

            #### 🌟 What's Fixed in v1.2.25:
            - 🎬 **Resolved JioHotstar Movie Playback Audio False Muting & Flapping**:
              - **The Problem**: During normal movie playback on JioHotstar, movie audio was getting muted most of the time, and only coming back temporarily when tapping the screen before muting again.
              - **Root Causes**:
                1. `tv_timer` view ID was mistakenly included as an ad timer ID; in Hotstar, `tv_timer` displays the movie's current playback time (`12:45 / 2:15:30`), which contains digits and triggered false ad detection.
                2. When controls auto-faded during movie playback, `hasMovieControls` became `false`. The standalone timer regex matched any bare number (0 to 180), so age rating badges (`16`, `18`, `13`, `12`), quality badges (`4K`), or subtitle numbers (`"10"`, `"5"`) were mistaken for ad countdowns.
                3. The `"of"` text indexer matched movie titles (`Avatar: The Way of Water`, `Guardians of the Galaxy`) and metadata without checking video boundaries.
                4. Movie duration timestamp checks (`hasMovieDurationTimestamp`) were declared but never connected to Hotstar's return condition.
              - **The Fix**:
                1. Removed `tv_timer` from ad timers and added it to playback controls and normal content verification.
                2. Refined `HOTSTAR_STANDALONE_TIMER_REGEX` to strictly require valid timer formats (`MM:SS`, `\d+s`, or explicit `Ad` / break prefixes), completely rejecting bare numbers like age ratings and subtitle text.
                3. Connected `hasMovieDurationTimestamp` to Hotstar detection to guard movie playback from false positives.
                4. Constrained `"ad"` and `"of"` text indexing strictly to the video player canvas and excluded movie/episode metadata and audio description tracks.
            - ⚡ **Eliminated 2s to 4s Muting Delay on Hotstar In-Stream Ads**:
              - **The Problem**: Standalone countdown timers (`00:30`, `00:15`) were blocked from muting until previous movie controls (`exo_rew`, `exo_ffwd`) finished their 2s–4s fade-out animation.
              - **The Fix**: In the absence of movie duration timestamps, valid ad countdown timers mute instantly at **0ms** without waiting for fading controls.
            - 🎯 **All YouTube Banner Auto-Close & Instant Return Fixes Retained** (v1.2.24).
            - 🎧 **All OTT Seekbar & Spotify Background Receiver Features Retained**.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.25.apk** (Release, Signed) for the best performance.
          files: |
            SkipFlow-v1.2.25.apk
            SkipFlow-v1.2.25-debug.apk
          prerelease: false
