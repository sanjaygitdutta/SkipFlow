name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.18.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.18-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.18-Release-APK
          path: SkipFlow-v1.2.18.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.18' }}
          name: "SkipFlow v1.2.18 (Auto-Skip Intro, YouTube Auto-Resume 'Video Paused', Hotstar 0.0s Mute)"
          body: |
            ### 🚀 SkipFlow v1.2.18 — Auto-Skip Intro, YouTube Auto-Resume & Multi-OTT 0ms Engine

            #### 🌟 What's New in v1.2.18:
            - ⏯️ **YouTube Non-Stop Watching (Auto-Resume 'Video paused. Continue watching?')**:
              - Automatically clicks `"Yes"` / `"Continue"` when YouTube interrupts background, playlist, or long-session playback with the *"Video paused. Continue watching?"* prompt.
              - Multi-language support (English, Hindi, Spanish, French, German, Portuguese, Russian, Japanese, Korean, Indonesian).
              - Instant zero-friction resume without bothering the user.
            - ⏩ **Auto-Skip Intro Engine Across All 7 Platforms**:
              - Automatically detects and clicks `"Skip Intro"`, `"Skip Recap"`, `"Skip Opening"`, and `"Skip Credits"` buttons on **YouTube**, **JioHotstar**, **MX Player**, **SonyLIV**, **Amazon Prime Video**, **Netflix**, and **Zee 5**.
              - Multi-language support (English, Hindi, Spanish, French, German, Portuguese, Italian, Japanese, Korean, Chinese, Indonesian, Russian).
              - Dual-action click engine (Accessibility `ACTION_CLICK` with fallback hardware tap gesture centered on button coordinates).
              - Preserves 100% unmuted audio and zero-delay playback during intro skipping.
              - Full toggle control in Dashboard and Settings.
            - ⚡ **JioHotstar 0.0s Instant Ad Audio Muting (Fixed 3s–4s Initial Audio Delay)**:
              - Trust ad badges (`"Ad"`, `"AD"`, `"Sponsored"`, `"Advertisement"`, `"Ad break"`, `"Commercial break"`) at second 0.0 without waiting for the delayed countdown clock.
              - Upgraded Strategy 0.5 fast text indexing (<0.3ms) to search `"ad"`, `"sponsored"`, `"break"`, and `"of"`.
              - Removed the rigid 58% height boundary so ad containers and companion sponsor cards are never ignored.
              - Added `isHotstarNormalContent` for instant 0ms restoration as soon as normal content or live cricket resumes.
            - ⚡ **Amazon Prime Video 0ms Ad Engine & 0ms Content Restoration**:
              - Added Strategy 0 fast text indexing (<0.3ms) for `"ad"`, `"skip"`, and `"remaining"`.
              - Added `isPrimeVideoNormalContent` verifying Amazon X-Ray indicators (`x-ray`, `xray_button`), standard playback controls, and episode duration formats (`14:20 / 48:15`, `-34:20`) for 0ms audio restoration.
            - ⚡ **SonyLIV 0ms Ad Engine**:
              - Instant 0ms muting for `ad:(0:30)` and all timer/break variants with fast text indexing and verified normal content 0ms restoration.
            - ✨ **Onboarding Welcome Screen Complete Overhaul**:
              - Preserved exact `"SMART HANDS-FREE AI ASSISTANT"` header badge with animated pulsing beacon and trust reassurance.
              - Interactive 3-Tab Showcase Switcher (`Life Stories`, `Vibe Waves`, `0ms Pipeline`) with sticky floating glassmorphic CTA bar.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.18.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.18.apk
            SkipFlow-v1.2.18-debug.apk
          prerelease: false
