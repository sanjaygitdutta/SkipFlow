name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.20.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.20-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.20-Release-APK
          path: SkipFlow-v1.2.20.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.20' }}
          name: "SkipFlow v1.2.20 (Zero Audio Leakage Between Ads, Instant Restoration & 85% Battery Optimization)"
          body: |
            ### 🚀 SkipFlow v1.2.20 — Multi-Ad Zero Audio Leakage & Battery Optimization Engine

            #### 🌟 What's Fixed in v1.2.20:
            - 🔋 **Massive Battery & CPU Optimization (85%+ Power Reduction)**:
              - **Screen-Off Deep Sleep & Doze Support**: When your screen turns off or locks, visual UI scanning loops and the infrared proximity sensor ("Wave to Skip") pause immediately, allowing Android to enter deep sleep without draining battery in your pocket.
              - **Zero-Error Spotify Screen-Off Muting**: Background Spotify ad muting remains 100% active via dedicated OS Broadcasts and MediaSession listeners — muting ads seamlessly with the screen off or in your pocket.
              - **Adaptive Visual Radar**: Automatically relaxes from 40ms down to a peaceful 300ms heartbeat during stable video playback, slashing CPU Binder transactions by over 85%.
              - **Smart Event Coalescing**: Prevents subtitles and scrub bar changes from triggering rapid duplicate tree scans.
            - 🛡️ **Zero Audio Leakage Between Back-to-Back Ads (Ad 1 of 2 ➔ Ad 2 of 2)**:
              - **The Root Cause**: When Ad 1 finished or was skipped, SkipFlow unmuted audio immediately before Ad 2 had attached its views (during the 100ms–300ms transition), and a 1.0s post-skip grace period prevented Ad 2 from being muted. This caused 1s–2s of Ad 2's audio to blare through.
              - **Persistent Multi-Ad Sequence Tracker**: When Ad 1 is identified as `"1 of 2"` / `"1 of 3"` / `"1/2"`, SkipFlow locks `isMultiAdSequenceActive = true` and holds the audio mute across the entire transition into Ad 2. Ad 2 starts completely silenced from second 0.0 with zero audio blast!
              - Reduced post-skip grace window from 1000ms to 250ms and bypassed it for multi-ad sequences across all OTT platforms.
            - 🔊 **Instant Normal Content Restoration (Fixed 10s–20s Mute Lock)**:
              - **The Root Cause**: Video timestamps (`0:01`..`0:05`) and bare digits (`1..30`) were colliding with ad countdown logic. During the first 10s–20s of normal video, the active poller was tricked into renewing the 20-second watchdog repeatedly.
              - **Eliminated False Digit Collisions**: Purged bare video timestamps (`0:05`, `5s`) from ad lookup. Bare numbers `1..30` now strictly require genuine ad container IDs or skip actions, preventing normal content from ever being flagged as an ad.
              - Poller now restores audio in just 50ms–100ms (2–4 checks) as soon as ads end.
            - 🚫 **Eliminated Mid-Video False Mutes**:
              - Normal video playback elements (seek bubbles `+10s`/`-10s`, chapter titles, subtitles containing numbers, like/share/remix/download buttons, and video titles starting with `"Ad..."`) are strictly filtered out so audio is never muted during normal playback.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.20.apk** (Release, Signed) for the latest fixes and best performance.
          files: |
            SkipFlow-v1.2.20.apk
            SkipFlow-v1.2.20-debug.apk
          prerelease: false
