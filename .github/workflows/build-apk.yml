name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.0-APK
          path: SkipFlow-v1.1.0.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "SkipFlow v1.1.0 (Spotify Ad Muter & Multi-Platform OTT)"
          body: |
            ### ⏩ SkipFlow v1.1.0 — Spotify Ad Muter & Multi-Platform OTT Video Expansion
            
            #### 🌟 What's New in v1.1.0:
            - 🎧 **Spotify Smart Ad Muter**: Automatically and silently mutes promotional audio ads between songs in the background using zero extra battery (via Spotify's Device Broadcast Status).
            - 🎬 **Multi-Platform OTT Streaming Support**: Hands-free auto-skip and banner/interstitial dismissal across:
              - **Disney+ Hotstar (JioHotstar)** (Live sports & drama auto-skip)
              - **JioCinema & JioTV** (In-stream video ads & overlay banners)
              - **MX Player** (Auto-skip and popup interstitial close)
              - **DailyMotion & Twitch** (In-stream video ads)
            - 🎛️ **New Dashboard & Settings Controls**: Independent toggles for Spotify Ad Muter and OTT Streaming, complete with interactive setup guides.
            - 🛡️ **Guaranteed Audio Reliability**: Smooth volume muting and instant restoration failsafe watchdog.
            - ✋ **Hands-Free Wave Sensor**: Proximity wave gesture to skip or mute ads when cooking or hands are busy.
          files: SkipFlow-v1.1.0.apk
          prerelease: false
