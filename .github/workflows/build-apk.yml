name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.16.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.16-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.16-Release-APK
          path: SkipFlow-v1.2.16.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.16' }}
          name: "SkipFlow v1.2.16 (4-Pillar Zero-Delay Ad Detection & 0ms Content Return)"
          body: |
            ### 🚀 SkipFlow v1.2.16 — 4-Pillar Zero-Delay Ad Start Detection & 0ms Content Return

            #### 🌟 What's New in v1.2.16:
            - ⚡ **4-Pillar Zero-Delay Ad Start Detection Engine (YouTube & All OTT Platforms)**:
              - Completely eliminates the 2–3s delay when ads start across all platforms (YouTube, JioHotstar, MX Player, Prime Video, Netflix, SonyLIV, Zee5, JioSaavn, Spotify).
              - **Pillar 1: 100ms Foreground Radar Heartbeat**: Actively probes active media window at 10Hz, discovering ad start transitions in `<100ms` without waiting for throttled OS events.
              - **Pillars 2 & 3: Pre-Render Container Detection**: Matches layout containers (`ad_presenter`, `video_ad_container`, `skip_ad_button_container`, `skip_ad_countdown`, `player_learn_more_button`, etc.) within player bounds at second **0.0** before countdown text renders or alpha fade-ins finish.
              - **Pillar 4: Seamless Handover & 0ms Content Return**: Mutes audio immediately, hands over to 25ms active poller, and restores audio instantly at **0ms** as soon as normal content returns or ad is skipped.
            - 🏋️ **Gym & Workout Story Carousel (Manual & Auto-Swiping)**:
              - Added dedicated gym workout slide: *"Gym Beats Without Disturbed Workout"* — keeps workout pump uninterrupted and weights lifted without touching screen to skip sudden loud ads.
              - Full manual swipe freedom: users can swipe through all story slides manually with zero resistance or tap discrete edge arrows, while idle states continue auto-swiping continuously.
            - 🎬 **MX Player 0ms Ad Audio Muting & Fast Audio Recovery**:
              - Accurately detects and silences in-stream video ads formatted as `ad 1 of 3 : 15`, `ad 2 of 3 : (15)`, `ad 3 of 3 : (10)`, `ad 1 of 2 : (10)`, `ad 2 of 2 : (5)`, `ad 1 of 1 : 29` counting down towards 0.
              - Multi-layout inspection supporting bare break counters (`2 of 3 : (15)`, `3 of 3 : (10)`, `2 of 2 : (5)`, `1 of 3`, `1 of 1`, `1 of 2`) with parentheses `( )`, colons `: `, brackets, or prefixes/suffixes.
              - **Instant 0ms Muting & Restoration**: Silenced instantly at 0ms and restored at 0ms the moment normal content resumes.
            - 📺 **JioHotstar Standalone Ad Countdown Timers (0ms Mute & 0ms Recovery)**:
              - Accurately detects and mutes in-stream video ads that display **ONLY the time count** on screen without any "Ad" word or "1 of 1" break counter.
              - Full support for bare numbers (`59`, `29`, `15`, `5`, `1`), time formats (`1:29`, `0:59`, `0:15`), and prefix/suffix variations (`· 59`, `• 59`, `59s`, `:59`, `(59)`).
            - 🎵 **Spotify Screen-Sleep Ad Audio Muting & 0ms Fast Recovery**:
              - Automated MediaSession & Notification Action inspection: detects when Spotify removes or disables the "Next Track" skip button during commercial ads while screen is asleep or locked.
            - 📺 **YouTube Clean Screen Auto-Dismiss Engine**:
              - Automatically auto-fades and dismisses stuck accessibility player controls after 2.5 seconds of normal playback, restoring an unobstructed clean view on every video.
              - Post-skip instant dismissal so returning content plays without overlay clutter.
            - 🤩 **Interactive Mood & Vibe Simulator**:
              - Dynamic Canvas mood waveform graph with live Before/After interactive toggle switch.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.16.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.16.apk
            SkipFlow-v1.2.16-debug.apk
          prerelease: false
