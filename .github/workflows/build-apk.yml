name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.1.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.8-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.8-Release-APK
          path: SkipFlow-v1.1.8.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.8
          name: "SkipFlow v1.1.8 (Instant Rapid Skip & Zero Audio Lockup)"
          body: |
            ### ⏩ SkipFlow v1.1.8 — Instant Rapid Skip & Zero Audio Lockup

            #### 🌟 What's Fixed in v1.1.8:
            - ⚡ **Priority-1 Instant Auto-Skip**: The auto-skip scan executes as the very first operation upon any window change, eliminating all processing latency.
            - ⏱️ **Ultra-Fast 150ms Mute Poller**: Polling interval reduced to **150ms**. The millisecond the skip button appears (even without OS events), it is skipped immediately.
            - 🎯 **Pinpoint Touch Coordinates**: Hardware touch tap gesture is now targeted directly at the actual skip button's physical center coordinates instead of ancestor containers.
            - 🔊 **Zero Mute Locks on Normal Content**:
              - Confined in-stream ad boundary to the actual video player (28%–34% max), completely excluding sponsored product cards, video titles, and channel items below the player.
              - Removed false positive autoplay countdown IDs (`countdown_text`) and generic `ad_player_overlay` empty containers.
              - Added instant regular content detection (`time_bar`, `current_time`) so new content starts playing with instant audio.
              - Reduced failsafe watchdog from 65s to 35s.
            - 🔄 **Actionable Skip Validation**: Accurately tracks countdown numbers 1–30 across node and child trees, firing the click the exact instant countdown reaches 0 or disappears.

            > 💡 **Recommended**: Download **SkipFlow-v1.1.8.apk** (Release). If upgrading from an older debug build, uninstall the previous version once to clear signature caches.
          files: |
            SkipFlow-v1.1.8.apk
            SkipFlow-v1.1.8-debug.apk
          prerelease: false
