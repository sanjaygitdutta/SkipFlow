name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.1.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.6-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.6-Release-APK
          path: SkipFlow-v1.1.6.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.6
          name: "SkipFlow v1.1.6 (Instant Post-Skip Audio & Zero Muted Content)"
          body: |
            ### ⏩ SkipFlow v1.1.6 — Instant Post-Skip Audio & Zero Muted Content

            #### 🌟 What's Fixed in v1.1.6:
            - ⚡ **Instant Post-Skip Audio**: The exact millisecond the "Skip Ad" button is clicked, audio is restored immediately. No more delayed checks that fail due to fading ad animations!
            - 🛡️ **Zero Muting on Regular Videos**: Removed `ad_badge` and broad text matching from in-stream ad inspection. Sponsored product cards, affiliate tags, and shopping links below the video will NEVER mute regular content.
            - 📐 **Strict 32% Player Isolation for Muting**: Bounded in-stream ad inspection strictly to the top 32% video player box, completely ignoring video titles, channel descriptions, and comments.
            - 🎯 **Expanded Skip Coverage (Up to 58%)**: Skip button detection covers all video aspect ratios (16:9, 18:9, 4:3, and square videos).
            - 🔄 **Continuous 400ms Poller Skip Execution**: While an ad is playing, the background poller directly checks and clicks the skip button every 400ms, ensuring zero missed skips even if YouTube sends no system events.
            - 🔒 **100% Login-Free & Local**: Zero accounts, zero analytics, zero network calls.

            > 💡 **Recommended**: Download **SkipFlow-v1.1.6.apk** (Release). If upgrading from an older debug build, uninstall the previous version once to clear signature caches.
          files: |
            SkipFlow-v1.1.6.apk
            SkipFlow-v1.1.6-debug.apk
          prerelease: false
