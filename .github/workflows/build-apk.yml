name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.19.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.19-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.19-Release-APK
          path: SkipFlow-v1.2.19.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.19' }}
          name: "SkipFlow v1.2.19 (0ms Instant YouTube & Multi-OTT Ad Muting, Full Ad Duration Engine)"
          body: |
            ### 🚀 SkipFlow v1.2.19 — 0ms Instant Ad Audio Muting & Complete Ad Duration Engine

            #### 🌟 What's Fixed & Upgraded in v1.2.19:
            - 🔇 **0.0s Instant Ad Audio Muting (Permanent Fix for 3s–4s Initial Audio Leak)**:
              - **The Root Cause Solved**: Android accessibility services by default strip non-interactive UI elements. YouTube (Litho) and OTT players (Google IMA SDK, ExoPlayer) mark opening ad badges and countdown timers as `importantForAccessibility="no"`. This caused Android OS to withhold events until the interactive "Skip Ad" button became active 3s–5s later.
              - **Dual Inclusion**: Enabled `FLAG_INCLUDE_NOT_IMPORTANT_VIEWS` both in `accessibility_service_config.xml` and programmatically in `onServiceConnected()`, forcing the Android OS to deliver all ad node events instantly from second 0.0.
              - **Pre-Animation Interception**: Bypassed strict `isVisibleToUser` constraints (`requireVisible = false`) on verified ad containers (`adContainerIds`, `hotstarDirectIds`, `PRIME_VIDEO_AD_VIEW_IDS`, `SONYLIV_AD_VIEW_IDS`, `ZEE5_AD_VIEW_IDS`, `MX_PLAYER_AD_VIEW_IDS`) so audio mutes instantly during the player's 100ms–300ms alpha fade-in.
              - **Litho Headless Ad Timer Scanner**: BFS tree inspection now intercepts anonymous Litho numeric countdown nodes (`1` to `30s`, `"Skip in 5"`, `"0:05"`, `"5s"`) on YouTube even when view IDs are stripped or null.
              - **Permanent YouTube Ad Protection**: Fast-path detection triggers mute in `<0.5ms` without waiting for the skip button to appear.
            - ⏱️ **Full Ad Duration Tracking & Accurate Time-Saved Counter**:
              - Automatically tracks the true duration of non-skippable and bumper ads throughout playback.
              - 0ms audio restoration as soon as normal content or video resumes.
            - 📦 **Expanded Platform Ecosystem**:
              - Added official package registration for **Prime Video** (`com.primevideo.android`) and **Zee5** (`com.zee5.android`).

            > 💡 **Recommended**: Download **SkipFlow-v1.2.19.apk** (Release, Signed) for the latest fixes and best performance.
          files: |
            SkipFlow-v1.2.19.apk
            SkipFlow-v1.2.19-debug.apk
          prerelease: false
