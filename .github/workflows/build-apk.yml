name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.8-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.8-Release-APK
          path: SkipFlow-v1.2.8.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.8' }}
          name: "SkipFlow v1.2.8 (Fixed False Content Muting, Poster Ads & Clean Screen Guide)"
          body: |
            ### 🚀 SkipFlow v1.2.8 — No Content Sound Drops, Zero Sound Leaks & Screen Cleanliness Guide

            #### 🌟 What's New & Fixed in v1.2.8:
            - 🛡️ **Zero False Muting During Normal Content**:
              - Normal video content audio no longer drops for 30–40 seconds.
              - Creator sponsorships, video subtitles / closed captions, and product shopping tags are completely excluded from muting video audio.
              - In-video detection is strictly clamped to the actual video canvas so bottom-half poster ads never mute video playback.
            - 🔇 **Zero Audio Leak at Ad Start**:
              - Immediate frame 0.0 detection catches countdown timers and skip containers instantly, eliminating the 2–3s sound leak before ads mute.
            - ⏸️ **Dual-Ad & Long-Ad Protection (No Premature Unmuting)**:
              - Active poller absence threshold widened to 2.5s and failsafe watchdog timer extended to 65s so audio never flaps or starts prematurely during 45s–60s ads or Ad 1 of 2 transitions.
            - 🖥️ **Clean Screen Setup (Hide Stuck Controls)**:
              - Added interactive guide in Settings to quickly disable YouTube's built-in "Accessibility player" overlay that causes Forward/Backward/Pause buttons to stay permanently on screen.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.8.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.8.apk
            SkipFlow-v1.2.8-debug.apk
          prerelease: false
