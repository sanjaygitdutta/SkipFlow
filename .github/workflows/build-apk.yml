name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.5-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.5-Release-APK
          path: SkipFlow-v1.2.5.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.5
          name: "SkipFlow v1.2.5 (Instant 0ms Content Audio & Zero Feed False Positives)"
          body: |
            ### ⏩ SkipFlow v1.2.5 — Instant 0ms Content Audio & Ad Muting

            #### 🌟 What's New & Fixed in v1.2.5:
            - ⚡ **Instant 0ms Content Audio Restoration**:
              - Restores volume IMMEDIATELY with 0ms delay the very millisecond the Skip button is clicked or an ad concludes.
              - Completely eliminated artificial delay and hysteresis debounce during ad skips.
            - 🛡️ **Zero Feed False Positives**:
              - Cleaned countdown view IDs: removed static feed banner IDs (`ad_headline`, `ad_info_button`, `visit_advertiser_button`, `countdown_text`).
              - Real in-stream ad countdowns strictly require numeric progress or separator bullets.
              - Portrait video canvas is clamped strictly to the 16:9 player boundaries (`playerCanvasHeight <= 32%`), physically ignoring all feed cards below.
            - 🔊 **Unconditional Volume Recovery**:
              - `unmuteAdAudio()` now unconditionally guarantees that the media stream is unmuted and restored to the previous user volume (safe fallback of 60% max volume if volume was 0).
            - 📱 **Multi-Mode Support**:
              - Supports Fullscreen, Standard Half-screen Portrait, and Corner Floating Mini-player.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.5.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.5.apk
            SkipFlow-v1.2.5-debug.apk
          prerelease: false
