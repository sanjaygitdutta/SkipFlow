name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.7-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.7-Release-APK
          path: SkipFlow-v1.2.7.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.7
          name: "SkipFlow v1.2.7 (Zero Audio Flapping, Instant 0ms Content Volume & Clean View)"
          body: |
            ### ⏩ SkipFlow v1.2.7 — Instant 0ms Content Audio, Zero Audio Flapping & Clean View

            #### 🌟 What's New & Fixed in v1.2.7:
            - ⚡ **Instant 0ms Content Audio Restoration**:
              - Restores volume IMMEDIATELY with 0ms delay the very millisecond the Skip button is clicked.
              - Post-skip transition grace period shields content startup from residual ad view re-muting.
            - 🔇 **Zero Mid-Ad Flapping**:
              - Extended absence confirmation to 1000ms prevents countdown redraw transitions (e.g., 5s ➔ 4s) or overlay auto-fades from prematurely unmuting ad audio.
            - 🎯 **Instant 0s Ad Start Muting**:
              - Detects ads instantly on frame 1 even during overlay fade-in animations.
              - Added exact standalone "Ad" badge support and prioritized player containers in hierarchy traversal.
            - ⏩ **Smart Consecutive Ad Detection**:
              - Catches back-to-back ads (Ad 2 of 2) immediately on frame 1 without delay.
            - 🖥️ **Clean Video View**:
              - Strict playback control immunity prevents the service from touching YouTube's Forward 10s / Backward 10s / Pause controls.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.7.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.7.apk
            SkipFlow-v1.2.7-debug.apk
          prerelease: false
