name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.2-APK
          path: SkipFlow-v1.1.2.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "SkipFlow v1.1.2 (Continuous Playback Fix & Audio Hysteresis)"
          body: |
            ### ⏩ SkipFlow v1.1.2 — Continuous Playback Reliability & Audio Hysteresis

            #### 🌟 What's Fixed in v1.1.2:
            - 🛡️ **Zero Node Leaks / Continuous Playback Fix**: Completely solved service stalls during long multi-video listening sessions. All accessibility nodes are recycled immediately, preventing Android system IPC cache exhaustion.
            - ⚡ **Event Throttling**: Intelligently throttles rapid seekbar/content-changed events to protect IPC binder threads while maintaining instantaneous skip response (<100ms).
            - 🔇 **Audio Hysteresis (No 1st-Second Leak & No Flickering)**: Added smart debounced unmute confirmation (1200ms). Volume stays muted throughout ad segments, even when YouTube player controls auto-fade out or during transitions between back-to-back ads (Ad 1 of 2 -> Ad 2 of 2).
            - 🎯 **Expanded Ad Detection**: Added modern YouTube ad markers ("Sponsored", "Ad •", "Visit advertiser", "Learn more", "Reward in").
            - 🎧 **Safe Listening Volume**: Volume preservation prevents accidental zero-volume overrides.
          files: SkipFlow-v1.1.2.apk
          prerelease: false
