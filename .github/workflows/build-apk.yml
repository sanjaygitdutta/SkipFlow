name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.22.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.22-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.22-Release-APK
          path: SkipFlow-v1.2.22.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.22' }}
          name: "SkipFlow v1.2.22 (Instant 0ms Muting for YouTube 'Sponsored ·' Ads & Hotstar Stability)"
          body: |
            ### 🚀 SkipFlow v1.2.22 — True 0ms Instant Muting for YouTube "Sponsored ·" Ads

            #### 🌟 What's Fixed in v1.2.22:
            - 🎯 **Fixed YouTube 1s-3s Initial Ad Leakage on "Sponsored ·" Ads**:
              - **The Problem**: On modern YouTube, ads displaying "Sponsored · [Brand]" were leaking 1s to 3s of audio before muting. This was caused by three critical filters:
                1. `isPlaybackControlOrVideoTitle` was matching `viewId.contains("title")` and treating the ad headline as a normal video title.
                2. `isValidAdNode` was strictly clipping nodes at the bottom edge of the 16:9 video frame (`validAdBounds.bottom`), discarding the advertiser header/card that sits directly beneath the video player.
                3. `isFeedShoppingCard` was flagging `viewId.contains("promoted")` (`promoted_badge`), classifying the active in-stream ad badge as a shopping card.
              - **The Fix**:
                1. **Priority Zero 0ms Fast-Path**: Directly scans for `"Sponsored ·"`, `"Sponsored •"`, `"Sponsored"`, `"Ad ·"` anywhere in the active video canvas or watch header (top 58% of screen) and mutes with <0.3ms latency!
                2. **Video Title Protection**: Explicit ad indicators (`"sponsored"`, `"ad ·"`, `"advertisement"`, `"विज्ञापन"`) are never classified as normal video titles.
                3. **Watch Ad Header Expansion**: Allowed boundary expanded to the top 58% of the screen for explicit ad badges, capturing the advertiser header right beneath the player.
                4. **Shopping Card Bypass**: In-stream ad badges are never treated as feed shopping cards.
            - 🎬 **All Hotstar Movie Stability & Standalone Countdown Ad (59➔0, 39➔0) Fixes Retained**.
            - 🎧 **Spotify Screen-Off Background Muting & Battery Optimization Retained**.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.22.apk** (Release, Signed) for the best performance.
          files: |
            SkipFlow-v1.2.22.apk
            SkipFlow-v1.2.22-debug.apk
          prerelease: false
