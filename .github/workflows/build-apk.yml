name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.13.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.13-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.13-Release-APK
          path: SkipFlow-v1.2.13.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.13' }}
          name: "SkipFlow v1.2.13 (Zee 5 & JioSaavn 0ms Ad Muting & Instant Content Audio Restoration)"
          body: |
            ### 🚀 SkipFlow v1.2.13 — Zee 5 & JioSaavn 0ms Ad Muting & Content Restoration

            #### 🌟 What's New in v1.2.13:
            - 📺 **Zee 5 In-Stream Video Ad Protection**:
              - Hardware-level 0ms audio mute on ad start (`Ad 1 of 2`, `Ad ends in...`, compound counters).
              - Instant 0ms skip button click if available.
              - 0ms sound restoration immediately when normal video resumes.
            - 🎵 **JioSaavn Music & Podcasts 0ms Audio Ad Protection**:
              - Instant 0ms mute on commercial audio ad breaks between songs (`Advertisement`, `Sponsored`, `Ad 1 of 1`).
              - Instant 0ms unmuting and sound return as soon as a normal song plays.
              - Banner ads strictly do NOT mute audio because normal songs are playing.
              - Background notification listener keeps ads silenced even while multitasking.
            - 🎯 **All Existing Platforms Preserved**:
              - YouTube, Spotify, Hotstar, MX Player, Prime Video, Netflix, and SonyLIV logic remain strictly intact.
            - 💎 **Two-Tier Subscription Architecture**:
              - Basic YouTube (₹29/mo, ₹299/yr) & Premium All-Access (₹49/mo, ₹499/yr) with 15 free skips.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.13.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.13.apk
            SkipFlow-v1.2.13-debug.apk
          prerelease: false
