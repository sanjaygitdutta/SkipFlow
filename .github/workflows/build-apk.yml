name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.4.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.4-APK
          path: SkipFlow-v1.1.4.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4
          name: "SkipFlow v1.1.4 (Instant Unmute & Accurate Player Bounding)"
          body: |
            ### ⏩ SkipFlow v1.1.4 — Instant Unmute & Accurate Player Bounding

            #### 🌟 What's Fixed in v1.1.4:
            - 🎯 **Fixed False-Positive Video Muting**: Removed feed-level keywords ("sponsored", "learn more", "ad_view", "ad_badge") that caused normal videos to be muted when they started playing.
            - 📐 **Precise 38% YouTube Player Bounding**: Bounded YouTube portrait scanning strictly to the top 38% of the screen, completely isolating the video player from the comments, feed, and sponsored cards below.
            - ⚡ **Instant Post-Skip Audio Restoration**: Sound is now restored within 200ms when an ad is skipped instead of waiting through seconds of silence.
            - 🔄 **Deferred Event Scheduler**: Throttled content events are deferred instead of dropped, ensuring the "Skip Ad" button is never left unclicked on screen.
            - 🛡️ **Debounce Guard Fix**: Only debounces if a click action actually succeeded, allowing instant fallback attempts if a container view was not clickable.
          files: SkipFlow-v1.1.4.apk
          prerelease: false
