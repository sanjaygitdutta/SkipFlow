name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.1-APK
          path: SkipFlow-v1.1.1.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "SkipFlow v1.1.1 (Dynamic Onboarding & UI Overhaul)"
          body: |
            ### ⏩ SkipFlow v1.1.1 — Dynamic Onboarding & Modern Dashboard Overhaul
            
            #### 🌟 What's New in v1.1.1:
            - ✨ **Dynamic Onboarding & Welcome Screen**: Eye-catching hero landing page with floating dynamic media devices (Headphones 🎧, YouTube ▶️, Smartphone 📱, Smart TV 📺) and magnetic *"Tap to Start ⚡"* CTA (zero credentials or login needed, 100% on-device private).
            - 🎨 **Complete UI & Dashboard Overhaul**: Cybernetic status beacon with pulsing radar ring, 2x2 glassmorphic metrics grid, and 1-tap Quick Protected App Launchers.
            - 🎧 **Spotify Smart Ad Muter**: Automatically and silently mutes promotional audio ads between songs in the background using zero extra battery.
            - 🎬 **Multi-Platform OTT Streaming**: Hands-free auto-skip & banner dismissal for Disney+ Hotstar, JioCinema, MX Player, DailyMotion, and Twitch.
            - ✋ **Hands-Free Wave Sensor**: Proximity wave gesture to force-skip when cooking or working out.
          files: SkipFlow-v1.1.1.apk
          prerelease: false
