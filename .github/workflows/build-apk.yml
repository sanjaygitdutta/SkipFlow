name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.1.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.1.5-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.1.5-Release-APK
          path: SkipFlow-v1.1.5.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.5
          name: "SkipFlow v1.1.5 (Sustained 30s+ Ad Muting & Stability)"
          body: |
            ### ⏩ SkipFlow v1.1.5 — Sustained 30s+ Ad Muting & In-Stream Tracking

            #### 🌟 What's New in v1.1.5:
            - 🔇 **Fixed 30s+ Ad Sound Reactivation**: Resolved issue where long ads (30s+ unskippable or long-form ads) would prematurely unmute when video player controls auto-faded after a few seconds.
            - ⏱️ **Extended Watchdog & Smooth Control-Fade Hysteresis**: Increased safety watchdog limit to 5 minutes (from 60s) with active timestamp refreshing, and widened the unmute hysteresis to 2500ms so transient UI fades never break the mute state.
            - 🏷️ **In-Player Ad Badge Tracking**: Added in-stream ad tracking for `"Ad · 0:30"`, `"Ad •"`, `"ad_badge"`, and countdown markers strictly confined inside the top 38% video player box.
            - 🔒 **100% Login-Free & Local**: Zero accounts, zero login, zero tracking. Complete on-device accessibility and privacy.
            - 🔑 **Permanent Signed Keystore**: Signed with permanent release keystore for seamless installs and updates.

            > 💡 **Recommended**: Download **SkipFlow-v1.1.5.apk** (Release). If upgrading from an older v1.1.3 or debug build, uninstall the previous version once to refresh Android package signatures.
          files: |
            SkipFlow-v1.1.5.apk
            SkipFlow-v1.1.5-debug.apk
          prerelease: false
