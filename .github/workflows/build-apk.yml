name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.11.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.11-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.11-Release-APK
          path: SkipFlow-v1.2.11.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.11' }}
          name: "SkipFlow v1.2.11 (Google Play Billing, 15 Free Skips, 0ms Audio Mute & Persistent Notification)"
          body: |
            ### 🚀 SkipFlow v1.2.11 — Google Play Billing, 15 Free Skips, 0ms Audio Silencing & Persistent Protection

            #### 🌟 What's New & Upgraded in v1.2.11:
            - 🔇 **Strict 0ms Instant Sound Muting & Content Unmuting**:
              - Instantaneous 0ms hardware-level ad silencer on ad onset and mid-roll ads.
              - Instantaneous 0ms sound restoration when normal content starts or resumes mid-video.
              - Rule never breaks during the middle of ads or content with 30ms ultra-rapid watchdog poller.
            - 📌 **Persistent Ongoing Protection Notification**:
              - Pinned ongoing status notification in Android notification drawer that stays visible until SkipFlow is closed.
              - Dynamically displays real-time protection status ("Ad Audio Muted (0ms)" vs "0ms Instant Ad Silencing Active").
            - 💳 **Official Google Play Billing 7.1.1 Integration**:
              - Secure in-app subscriptions compliant with Google Play Monetization policies.
              - **Monthly Plan**: `monthly_unlimited_skips` (₹29 / month).
              - **Yearly Plan**: `yearly_unlimited_skips` (₹299 / year — Save 14%, ~₹24.9/mo).
            - 🎁 **15 Free Ad Skips Counter**:
              - 15 free automatic ad skips to experience hands-free flow.
              - Once 15 free skips are used, auto-click prompts subscription while 0ms audio muting continues.
            - ✨ **Ultra-Sleek In-App Paywall & Subscription Hub**:
              - Real-time free skips progress bar (`X / 15 used`).
              - Detailed feature comparison, one-tap "Restore Purchases" button, and Developer/Reviewer bypass mode.
            - 🎨 **Enhanced Background Visibility & Streamlined Dashboard**:
              - Clean, non-repetitive dashboard layout with high-visibility background images.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.11.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.11.apk
            SkipFlow-v1.2.11-debug.apk
          prerelease: false
