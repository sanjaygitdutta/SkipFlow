name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.3-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.3-Release-APK
          path: SkipFlow-v1.2.3.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.3
          name: "SkipFlow v1.2.3 (Intelligent Multi-Mode Ad Detection: Fullscreen, Half-screen & Corner Miniplayer)"
          body: |
            ### ⏩ SkipFlow v1.2.3 — Intelligent Multi-Mode Ad Detection

            #### 🌟 What's Fixed in v1.2.3:
            - 📱 **Intelligent Multi-Mode Ad Detection (All YouTube Formats)**:
              - **Mode 1: Full-Screen Mode** (Landscape or Rotated Fullscreen) — 100% video canvas coverage.
              - **Mode 2: Half-Screen / Top Player** (Standard Portrait) — dynamic 16:9/18:9 boundary (`35%–42%`) capturing bottom-edge ad buttons without cutting off on tall screens.
              - **Mode 3: Minimized / Corner Floating Mini-Player** — detects YouTube's floating miniplayer and docked PiP windows. Even when videos are shrunk into a tiny corner, ads are detected, muted, and skipped.
            - 🚫 **Eliminated `time_bar` Mute Blocker**:
              - Removed the conflict where YouTube's progress seekbar (`time_bar`) prevented real in-stream ads from muting. In-stream ad detection now takes absolute priority: **0ms instant mute**.
            - 🛡️ **Intelligent Feed Shopping Card Filter**:
              - Explicitly filters out static recommendation cards and sponsored products in the feed below by checking for shopping cues (prices `₹`/`$`, "Shop now", "Buy now", star ratings `★`) and viewport boundaries.
            - ⚡ **Zero-Delay Post-Ad Audio Restoration (200ms)**:
              - Restores the original video sound the instant the ad finishes or is skipped.
            - 🎯 **Universal Skip Execution**:
              - Actionable Skip Ad buttons are clicked anywhere on screen across all 3 viewing modes with dual hardware tap gestures.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.3.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.3.apk
            SkipFlow-v1.2.3-debug.apk
          prerelease: false
