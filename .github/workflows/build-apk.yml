name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.4-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.4-Release-APK
          path: SkipFlow-v1.2.4.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.4
          name: "SkipFlow v1.2.4 (Permanent Fix: 100% Guaranteed Content Audio & In-Stream Ad Muting)"
          body: |
            ### ⏩ SkipFlow v1.2.4 — Guaranteed Content Audio & In-Stream Ad Muting

            #### 🌟 What's Fixed in v1.2.4:
            - 🔊 **Guaranteed Content Audio Playback (Zero Phantom Muting)**:
              - Fixed the issue where normal video sound was muted due to feed recommendation cards below the video player matching static "Sponsored" labels.
              - In-stream ad badges now strictly require separator bullets (`·`, `•`, `:`) or countdown digits (`0:15`, `5s`) or multi-ad indicators (`1 of 2`). Static plain feed labels without bullets are completely ignored.
              - Clamped the portrait player boundary strictly to 33% of the screen, physically excluding recommendation cards and shopping feeds below the player.
            - ⚡ **Zero-Delay Audio Restoration (200ms)**:
              - Normal video sound restores instantly (200ms) the moment an ad finishes or is skipped.
            - ⏱️ **Full Support for Lengthy Ads (45s–120s+)**:
              - Autonomous 150ms active poller keeps lengthy ads muted by dynamically extending the watchdog while confirming real in-stream ad indicators.
            - 📱 **Multi-Mode Support**:
              - Supports Fullscreen, Standard Portrait, and Corner Floating Mini-player.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.4.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.4.apk
            SkipFlow-v1.2.4-debug.apk
          prerelease: false
