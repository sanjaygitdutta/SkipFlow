name: Build SkipFlow Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew script permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Gradle Build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./SkipFlow-v1.2.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./SkipFlow-v1.2.2-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipFlow-v1.2.2-Release-APK
          path: SkipFlow-v1.2.2.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "SkipFlow v1.2.2 (Continuous Muting for Lengthy Ads & Instant Content Audio)"
          body: |
            ### ⏩ SkipFlow v1.2.2 — Continuous Muting for Lengthy Ads & Instant Content Audio

            #### 🌟 What's Fixed in v1.2.2:
            - ⏱️ **Guaranteed Continuous Muting for Lengthy Ads (Even Without Countdown Ticking)**:
              - Added dedicated support for long-format ads (1m, 2m, 3m+) that do not display countdown ticking.
              - In-stream ad badges (`"Sponsored"`, `"Ad"`, `"Ad 1 of 2"`, localized badges) inside the video player canvas are now detected even without digits or separator bullets, provided they match compact overlay badge dimensions (`<65% width`, `<50% player height`).
              - Added support for in-stream ad IDs (`ad_badge_text`, `ad_headline`, `ad_info_button`, `visit_advertiser_button`).
            - 🔊 **Active Volume Stream Shield**:
              - Autonomous 150ms poller re-enforces `ensureMuted()` on every confirmed ad tick. Even if physical volume rockers are accidentally pressed during an ad, the music stream is immediately kept silent while saving the user's volume preference.
            - ⚡ **Zero-Delay Content Audio Restoration**:
              - Audio restores immediately (200ms) the instant the ad finishes or regular video content (`time_bar`) appears.
              - Normal video playback is never muted.
              - Feed recommendation cards and shopping carousels below the 33% player threshold remain physically excluded.

            > 💡 **Recommended**: Download **SkipFlow-v1.2.2.apk** (Release, Signed).
          files: |
            SkipFlow-v1.2.2.apk
            SkipFlow-v1.2.2-debug.apk
          prerelease: false
